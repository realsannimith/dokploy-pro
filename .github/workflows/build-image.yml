name: Build Dokploy Pro Images

# Builds Dokploy Pro and pushes its images to GitHub Container Registry
# (ghcr.io/<owner>/<repo>:custom) on every push to canary, together with the
# companion monitoring image (ghcr.io/<owner>/<repo>:monitoring-custom). Uses
# the built-in GITHUB_TOKEN — no extra secrets needed. install.sh and the
# in-app updater pull from these images by default.

on:
  push:
    branches: [canary]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Optional SemVer tag for a stable release build
        required: false
        type: string
        default: ""
      ref:
        description: Git ref or commit to build
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          VERSION="${{ inputs.version }}"

          if [ -n "$VERSION" ]; then
            if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid release version: $VERSION" >&2
              exit 1
            fi

            {
              echo "app_tags<<EOF"
              echo "${IMAGE}:${VERSION}"
              echo "${IMAGE}:latest"
              echo "${IMAGE}:custom"
              echo "EOF"
              echo "monitoring_tags<<EOF"
              echo "${IMAGE}:monitoring-${VERSION}"
              echo "${IMAGE}:monitoring-latest"
              echo "${IMAGE}:monitoring-custom"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "app_tags=${IMAGE}:custom" >> "$GITHUB_OUTPUT"
            echo "monitoring_tags=${IMAGE}:monitoring-custom" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare env file
        run: |
          cp apps/dokploy/.env.production.example .env.production
          cp apps/dokploy/.env.production.example apps/dokploy/.env.production

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.app_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push monitoring
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.monitoring
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.monitoring_tags }}
          cache-from: type=gha,scope=monitoring
          cache-to: type=gha,mode=max,scope=monitoring
